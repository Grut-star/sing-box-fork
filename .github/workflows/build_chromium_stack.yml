name: Build Chromium Stack (Android ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Используем более агрессивный чистильщик (освобождает ~40-45 ГБ надежнее)
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true # Удаляем системный Android, т.к. Chromium скачает свой герметичный NDK
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
          echo "Remaining disk space:"
          df -h

      # 2. Потоковая распаковка и фейковый Git
      - name: Stream Extract & Purge Chromium
        run: |
          mkdir src && cd src
          echo "Starting streaming extraction with on-the-fly filtering..."
          
          curl -L "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-152.0.7977.42.tar.xz" | tar -xJ --strip-components=1 \
            --exclude="third_party/blink/web_tests" \
            --exclude="chrome/test/data" \
            --exclude="third_party/catapult" \
            --exclude="v8/test" \
            --exclude="native_client" \
            --exclude="third_party/angle/src/tests"
          
          echo "Initializing dummy Git repository for gclient..."
          git init
          git config user.name "Builder"
          git config user.email "build@example.com"
          # Делаем пустой коммит, чтобы ветка master/main официально существовала
          git commit --allow-empty -m "Init dummy repo"
          
          echo "Remaining disk space:"
          df -h

      # 3. Генерация gclient конфига с ЖЕСТКИМИ ограничениями
      - name: Generate gclient config
        run: |
          cat <<EOF > .gclient
          solutions = [{
            "name": "src",
            "url": "https://chromium.googlesource.com/chromium/src.git",
            "deps_file": "DEPS",
            "managed": False,
            "custom_vars": {
              "checkout_telemetry_dependencies": False,
              "checkout_android_emulator": False,
              "checkout_android_native_support": False,
              "checkout_pgo_profiles": False, # ОЧЕНЬ ВАЖНО: Отключает скачивание ~2 ГБ профилей
              "checkout_nacl": False,
              "checkout_clang_tidy": False,
              "download_remoteexec_cfg": False,
              "checkout_src_internal": False
            }
          }]
          target_os = ['android']
          EOF

      # 4. Установка NDK и Clang (теперь ничего лишнего не скачается)
      - name: Fetch Toolchains (runhooks)
        run: |
          cd src
          gclient runhooks

      # 5. Накатываем патчи
      - name: Apply Eidolon Patches
        run: |
          cd src
          python3 ../stack_builder/patch_chromium_v152.py
          cp ../stack_builder/eidolon_bridge.* net/socket/
          sed -i '/"socket\/tcp_client_socket.cc",/a \    "socket/eidolon_bridge.cc",' net/BUILD.gn

      # 6. Конфигурируем и собираем ТОЛЬКО сетевой стек
      - name: Configure and Compile
        run: |
          cd src
          gn gen out/Android --args='target_os="android" target_cpu="arm64" is_debug=false is_component_build=true symbol_level=0 blink_symbol_level=0 v8_symbol_level=0'
          autoninja -C out/Android net boringssl

      # 7. Забираем артефакты
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libeidolon_net_arm64
          path: src/out/Android/libnet.so