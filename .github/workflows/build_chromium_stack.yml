name: Build Chromium Stack (Android ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Тотальная очистка диска (освобождает ~45+ ГБ)
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      # 2. Потоковая распаковка и агрессивная чистка мусора
      - name: Stream Extract & Purge Chromium
        run: |
          mkdir src && cd src
          echo "Starting streaming extraction... This will take some time."
          curl -L "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-152.0.7977.42.tar.xz" | tar -xJ --strip-components=1
          
          echo "Purging massive unused directories to free disk space..."
          # Удаляем тестовые данные Blink (~6-8 ГБ)
          rm -rf third_party/blink/web_tests
          # Удаляем тестовые данные Chrome (~3 ГБ)
          rm -rf chrome/test/data
          # Удаляем инструменты телеметрии и тесты V8 (~2-3 ГБ)
          rm -rf third_party/catapult
          rm -rf v8/test
          # Удаляем Native Client, если он есть
          rm -rf native_client
          
          echo "Remaining disk space:"
          df -h

      # 3. Генерация gclient конфига с ограничениями (чтобы runhooks качал меньше)
      - name: Generate gclient config
        run: |
          cat <<EOF > .gclient
          solutions = [{
            "name": "src",
            "url": "https://chromium.googlesource.com/chromium/src.git",
            "deps_file": "DEPS",
            "managed": False,
            "custom_vars": {
              "checkout_telemetry_dependencies": False,
              "checkout_android_emulator": False,
              "checkout_android_native_support": False
            }
          }]
          target_os = ['android']
          EOF

      # 4. Установка NDK и Clang (теперь места хватит)
      - name: Fetch Toolchains (runhooks)
        run: |
          cd src
          gclient runhooks

      # 4. Накатываем наши патчи
      - name: Apply Eidolon Patches
        run: |
          cd src
          python3 ../stack_builder/patch_chromium_v152.py
          cp ../stack_builder/eidolon_bridge.* net/socket/
          sed -i '/"socket\/tcp_client_socket.cc",/a \    "socket/eidolon_bridge.cc",' net/BUILD.gn

      # 5. Конфигурируем и собираем ТОЛЬКО сетевой стек
      - name: Configure and Compile
        run: |
          cd src
          gn gen out/Android --args='target_os="android" target_cpu="arm64" is_debug=false is_component_build=true symbol_level=0 blink_symbol_level=0 v8_symbol_level=0'
          autoninja -C out/Android net boringssl

      # 6. Забираем готовые артефакты (пару мегабайт)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libeidolon_net_arm64
          path: src/out/Android/libnet.so