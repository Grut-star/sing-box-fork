name: Build Chromium Stack (Android ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Используем более агрессивный чистильщик (освобождает ~40-45 ГБ надежнее)
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false # Удаляем системный Android, т.к. Chromium скачает свой герметичный NDK
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
          echo "Remaining disk space:"
          df -h

      # 2. Потоковая распаковка и тотальный фейковый Git
      - name: Stream Extract & Purge Chromium
        run: |
          mkdir src && cd src
          echo "Starting streaming extraction with on-the-fly filtering..."
          
          curl -L "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-152.0.7977.42.tar.xz" | tar -xJ --strip-components=1 \
            --exclude="third_party/blink/web_tests" \
            --exclude="chrome/test/data" \
            --exclude="third_party/catapult" \
            --exclude="v8/test" \
            --exclude="native_client" \
            --exclude="third_party/angle/src/tests"
          
          echo "Initializing dummy Git repository in root..."
          git init >/dev/null 2>&1
          git config user.name "Builder"
          git config user.email "build@example.com"
          git commit --allow-empty -m "Init dummy repo" >/dev/null 2>&1
          
          echo "Initializing dummy Git repositories for all DEPS..."
          python3 -c '
          import os, re
          
          # Читаем конфигурацию зависимостей Chromium
          with open("DEPS", "r") as f:
              data = f.read()
          
          # Ищем все пути вида "src/third_party/angle", "src/v8" и т.д.
          paths = set(re.findall(r"[\x27\x22]src/([a-zA-Z0-9_/-]+)[\x27\x22]", data))
          
          for p in paths:
              if os.path.isdir(p):
                  # Создаем фейковый git-репозиторий в каждой зависимости
                  os.system(f"cd {p} && git init >/dev/null 2>&1 && git config user.name \"B\" && git config user.email \"b@b.com\" && git commit --allow-empty -m \"Init\" >/dev/null 2>&1")
          '
          
          echo "Remaining disk space:"
          df -h

      # 3. Генерация gclient конфига с ЖЕСТКИМИ ограничениями
      - name: Generate gclient config
        run: |
          cat <<EOF > .gclient
          solutions = [{
            "name": "src",
            "url": "https://chromium.googlesource.com/chromium/src.git",
            "deps_file": "DEPS",
            "managed": False, # ОЧЕНЬ ВАЖНО: блокирует скачивание всех git-репозиториев
            "custom_vars": {
              "checkout_telemetry_dependencies": False,
              "checkout_android_emulator": False,
              "checkout_android_native_support": True, # ИСПРАВЛЕНО: Разрешаем NDK/SDK
              "checkout_pgo_profiles": False,
              "checkout_nacl": False,
              "checkout_clang_tidy": False,
              "download_remoteexec_cfg": False,
              "checkout_src_internal": False
            }
          }]
          target_os = ['android']
          EOF

      # 4. Установка Toolchains (Обходим gclient sync и используем NDK раннера)
      - name: Fetch Toolchains & Link System NDK
        run: |
          cd src
          
          # 1. Запускаем только runhooks (скачает компилятор Clang без проверок Git)
          gclient runhooks
          
          # 2. Принудительно включаем Android-флаги для GN (подстраховка с переносом строки)
          echo "" >> build/config/gclient_args.gni
          echo 'checkout_android = true' >> build/config/gclient_args.gni
          echo 'checkout_android_native_support = true' >> build/config/gclient_args.gni
          
          # 3. Создаем папки, которые ожидает Chromium
          mkdir -p third_party/android_toolchain
          mkdir -p third_party/android_sdk
          
          # 4. Линкуем NDK и SDK, которые УЖЕ установлены на GitHub Actions ($ANDROID_HOME)
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          echo "Linking NDK from: $NDK_PATH"
          ln -sf $NDK_PATH third_party/android_toolchain/ndk
          ln -sf $ANDROID_HOME third_party/android_sdk/public
          
          # 5. Вырезаем из конфигов Chromium жесткие проверки на конкретную версию NDK
          sed -i '/assert.*_ndk_/d' build/config/android/config.gni

      # 5. Накатываем патчи и создаем таргет для единой .so библиотеки
      - name: Apply Eidolon Patches
        run: |
          cd src
          python3 ../stack_builder/patch_chromium_v152.py
          cp ../stack_builder/eidolon_bridge.* net/socket/
          
          echo "Generatig dummy BUILD.gn stubs for excluded directories..."
          
          # 1. Базовые заглушки для корневых удаленных папок
          for dir in "third_party/blink/web_tests" "chrome/test/data" "third_party/catapult" "v8/test" "native_client" "third_party/angle/src/tests"; do
            mkdir -p "$dir"
            echo "group(\"$(basename $dir)\") {}" > "$dir/BUILD.gn"
          done
          
          # 2. Автоматическое сканирование: ищем все вложенные вызовы в BUILD.gn и глушим их
          grep -oE '"//(third_party/catapult|third_party/blink/web_tests|v8/test|native_client|third_party/angle/src/tests|chrome/test/data)[^"]*"' BUILD.gn | sed 's/"//g; s/^\/\///g' | while read -r dir; do
            if [ ! -f "$dir/BUILD.gn" ]; then
              mkdir -p "$dir"
              TARGET_NAME=$(basename "$dir")
              echo "group(\"$TARGET_NAME\") {}" > "$dir/BUILD.gn"
              echo "Auto-stubbed: $dir"
            fi
          done
          
          # Добавляем наш кастомный таргет в конец net/BUILD.gn
          cat << 'EOF' >> net/BUILD.gn
          
          shared_library("libeidolon") {
            sources = [
              "socket/eidolon_bridge.cc",
            ]
            deps = [
              "//net:net",
              "//base:base",
              "//url:url",
              "//crypto:crypto",
              "//third_party/boringssl:boringssl",
            ]
          }
          EOF

      # 6. Конфигурируем и собираем нашу кастомную .so
      - name: Configure and Compile
        run: |
          cd src
          gn gen out/Android --args='
            target_os="android"
            target_cpu="arm64"
            is_debug=false
            is_component_build=false
            is_official_build=true
            use_thin_lto=true
            symbol_level=0
            blink_symbol_level=0
            v8_symbol_level=0
            exclude_unwind_tables=true
          '
          # Собираем ТОЛЬКО наш таргет
          autoninja -C out/Android net:libeidolon

      # 7. Забираем сжатый артефакт
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libeidolon_net_arm64
          path: src/out/Android/libeidolon.so