name: Build Eidolon Stack
on:
  #schedule:
  #  - cron: '0 3 * * *' # Запуск каждый день в 03:00 UTC
  workflow_dispatch: # Оставляем кнопку для ручного запуска

# Выдаем права на создание релизов и управление actions
permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash
    working-directory: src

env:
  CACHE_EPOCH: 1
  CCACHE_MAXSIZE: 200M
  CCACHE_MAXFILES: 0
  SCCACHE_CACHE_SIZE: 200M

jobs:
  prepare:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    outputs:
      chromium_version: ${{ steps.get_version.outputs.VERSION }}
      should_build: ${{ steps.check.outputs.SHOULD_BUILD }}
    steps:
      - name: Fetch Latest Chromium Version
        id: get_version
        run: |
          VERSION=$(curl -s "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Android" | jq -r '.[0].version')
          echo "Target Chromium Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Check if Release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          # Проверяем, существует ли релиз с тегом v{VERSION}
          if gh release view "v$VERSION" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Skipping build."
            echo "SHOULD_BUILD=false" >> $GITHUB_OUTPUT
          else
            echo "New version v$VERSION found. Proceeding with build."
            echo "SHOULD_BUILD=true" >> $GITHUB_OUTPUT
          fi

  cache-toolchains-posix:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - name: Cache toolchains (Linux, OpenWrt, Android)
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/qemu-user*.deb
          key: toolchains-posix-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache Android NDK (Android)
        uses: actions/cache@v4
        with:
          path: src/third_party/android_toolchain/ndk/
          key: android-ndk-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - id: ccache-timestamp
        run: echo "CCACHE_TIMESTAMP=$(date +%s)" >>$GITHUB_OUTPUT
      - name: Host tool ccache
        uses: actions/cache@v4
        with:
          path: src/.host_tool_cache
          key: ccache-posix-${{ hashFiles('CHROMIUM_VERSION') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: ccache-posix-${{ hashFiles('CHROMIUM_VERSION') }}-
      - name: Install APT packages
        run: |
          sudo apt update
          sudo apt install -y ninja-build pkg-config ccache bubblewrap libxkbcommon-dev libgtk-3-dev libglib2.0-dev libgbm-dev libpci-dev libnss3-dev
      - run: EXTRA_FLAGS='target_os="android" target_cpu="x64"' ./get-clang.sh

  cache-toolchains-win:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-2022
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            ~/.cargo/bin/
            ~/bin/ninja.exe
          key: toolchains-win-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - run: EXTRA_FLAGS='target_cpu="x64"' ./get-clang.sh
      - run: EXTRA_FLAGS='target_cpu="x86"' ./get-clang.sh
      - run: |
          if [ ! -f ~/bin/ninja.exe ]; then
            curl -LO https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip
            unzip ninja-win.zip -d ~/bin
          fi

  cache-toolchains-mac-x64:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-15-intel
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
          key: toolchains-mac-x64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - run: EXTRA_FLAGS='target_cpu="x64"' ./get-clang.sh

  cache-toolchains-mac-arm64:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-15
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
          key: toolchains-mac-arm64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - run: EXTRA_FLAGS='target_cpu="arm64"' ./get-clang.sh

