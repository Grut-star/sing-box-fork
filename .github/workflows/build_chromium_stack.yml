name: Build Eidolon Stack
on:
  push:
    branches: [master]
    paths-ignore: [README.md]
  release:
    types: [published]
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: src

env:
  CACHE_EPOCH: 1
  CCACHE_MAXSIZE: 200M
  CCACHE_MAXFILES: 0
  SCCACHE_CACHE_SIZE: 200M

jobs:
  prepare:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    outputs:
      chromium_version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Fetch Latest Chromium Version
        id: get_version
        run: |
          VERSION=$(curl -s "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Android" | jq -r '.[0].version')
          echo "Target Chromium Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  cache-toolchains-posix:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - name: Cache toolchains (Linux, OpenWrt, Android)
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/qemu-user*.deb
          key: toolchains-posix-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache Android NDK (Android)
        uses: actions/cache@v4
        with:
          path: src/third_party/android_toolchain/ndk/
          key: android-ndk-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - id: ccache-timestamp
        run: echo "CCACHE_TIMESTAMP=$(date +%s)" >>$GITHUB_OUTPUT
      - name: Host tool ccache
        uses: actions/cache@v4
        with:
          path: src/.host_tool_cache
          key: ccache-posix-${{ hashFiles('CHROMIUM_VERSION') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: ccache-posix-${{ hashFiles('CHROMIUM_VERSION') }}-
      - name: Install APT packages
        run: |
          sudo apt update
          sudo apt install ninja-build pkg-config ccache
      - run: EXTRA_FLAGS='target_os="android" target_cpu="x64"' ./get-clang.sh

  cache-toolchains-win:
    needs: prepare
    runs-on: windows-2022
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            ~/.cargo/bin/
            ~/bin/ninja.exe
          key: toolchains-win-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - run: EXTRA_FLAGS='target_cpu="x64"' ./get-clang.sh
      - run: EXTRA_FLAGS='target_cpu="x86"' ./get-clang.sh
      - run: |
          if [ ! -f ~/bin/ninja.exe ]; then
            curl -LO https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip
            unzip ninja-win.zip -d ~/bin
          fi

  cache-toolchains-mac-x64:
    needs: prepare
    runs-on: macos-15-intel
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
          key: toolchains-mac-x64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - run: EXTRA_FLAGS='target_cpu="x64"' ./get-clang.sh

  cache-toolchains-mac-arm64:
    needs: prepare
    runs-on: macos-15
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
          key: toolchains-mac-arm64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - run: EXTRA_FLAGS='target_cpu="arm64"' ./get-clang.sh

  linux:
    needs: [prepare, cache-toolchains-posix]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64, arm]
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}"'
      BUNDLE: eidolon-${{ github.event.release.tag_name || 'dev' }}-${{ github.job }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/qemu-user*.deb
          key: toolchains-posix-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Download Chromium
        run: curl -L "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-${{ env.CHROMIUM_VERSION }}.tar.xz" | tar -xJ --strip-components=1
      - name: Cache sysroot
        uses: actions/cache@v4
        with:
          path: |
            src/out/sysroot-build/bullseye/bullseye_*
            src/out/sysroot-build/trixie/trixie_*
            src/out/sysroot-build/sid/sid_*
          key: sysroot-linux-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Install APT packages
        run: |
          sudo apt update
          sudo apt install ninja-build pkg-config ccache bubblewrap
      - run: ./get-clang.sh
      - run: ccache -z || true
      - run: ./build.sh
      - name: Pack artifacts
        run: |
          mkdir ${{ env.BUNDLE }}
          cp out/Release/*eidolon* eidolon_bridge.h ${{ env.BUNDLE }}/
          tar cJf ${{ env.BUNDLE }}.tar.xz ${{ env.BUNDLE }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}.tar.xz
          path: src/${{ env.BUNDLE }}.tar.xz

  android:
    needs: [prepare, cache-toolchains-posix]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            abi: x86_64
          - arch: x86
            abi: x86
          - arch: arm64
            abi: arm64-v8a
          - arch: arm
            abi: armeabi-v7a
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}" target_os="android"'
      BUNDLE: eidolon-${{ github.event.release.tag_name || 'dev' }}-android-${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          dotnet: true
          haskell: true
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
          key: toolchains-posix-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: src/third_party/android_toolchain/ndk/
          key: android-ndk-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Download Chromium
        run: curl -L "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-${{ env.CHROMIUM_VERSION }}.tar.xz" | tar -xJ --strip-components=1
      - name: Install APT packages
        run: |
          sudo apt update
          sudo apt install ninja-build pkg-config ccache
      - run: ./get-clang.sh
      - run: ./build.sh
      - name: Pack artifacts
        run: |
          mkdir ${{ env.BUNDLE }}
          cp out/Release/*eidolon* eidolon_bridge.h ${{ env.BUNDLE }}/
          tar cJf ${{ env.BUNDLE }}.tar.xz ${{ env.BUNDLE }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}.tar.xz
          path: src/${{ env.BUNDLE }}.tar.xz

  win:
    needs: [prepare, cache-toolchains-win]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}"'
      BUNDLE: eidolon-${{ github.event.release.tag_name || 'dev' }}-${{ github.job }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            ~/.cargo/bin/
            ~/bin/ninja.exe
          key: toolchains-win-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Download Chromium
        run: |
          curl.exe -L "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-${{ env.CHROMIUM_VERSION }}.tar.xz" -o chromium.tar.xz
          tar -xJ -f chromium.tar.xz --strip-components=1 || true
          rm chromium.tar.xz
      - run: ./get-clang.sh
      - run: ~/.cargo/bin/sccache -z || true
      - run: ./build.sh
      - name: Pack artifacts
        run: |
          mkdir ${{ env.BUNDLE }}
          cp out/Release/*eidolon* eidolon_bridge.h ${{ env.BUNDLE }}/
          7z a ${{ env.BUNDLE }}.zip ${{ env.BUNDLE }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}.zip
          path: src/${{ env.BUNDLE }}.zip

  mac-x64:
    needs: [prepare, cache-toolchains-mac-x64]
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}"'
      BUNDLE: eidolon-${{ github.event.release.tag_name || 'dev' }}-${{ github.job }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
          key: toolchains-mac-x64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Download Chromium
        run: curl -L "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-${{ env.CHROMIUM_VERSION }}.tar.xz" | tar -xJ --strip-components=1
      - run: brew install ninja ccache
      - run: pip install setuptools || true
      - run: ./get-clang.sh
      - run: ./build.sh
      - name: Pack artifacts
        run: |
          mkdir ${{ env.BUNDLE }}
          cp out/Release/*eidolon* eidolon_bridge.h ${{ env.BUNDLE }}/
          tar cJf ${{ env.BUNDLE }}.tar.xz ${{ env.BUNDLE }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}.tar.xz
          path: src/${{ env.BUNDLE }}.tar.xz

  mac-arm64:
    needs: [prepare, cache-toolchains-mac-arm64]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    env:
      CHROMIUM_VERSION: ${{ needs.prepare.outputs.chromium_version }}
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}"'
      BUNDLE: eidolon-${{ github.event.release.tag_name || 'dev' }}-${{ github.job }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        working-directory: .
        run: |
          mkdir -p src
          cp -R stack_builder/* src/
          chmod +x src/*.sh
          echo "${{ env.CHROMIUM_VERSION }}" > CHROMIUM_VERSION
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
          key: toolchains-mac-arm64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Download Chromium
        run: curl -L "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-${{ env.CHROMIUM_VERSION }}.tar.xz" | tar -xJ --strip-components=1
      - run: brew install ninja ccache
      - run: pip install setuptools || true
      - run: ./get-clang.sh
      - run: ./build.sh
      - name: Pack artifacts
        run: |
          mkdir ${{ env.BUNDLE }}
          cp out/Release/*eidolon* eidolon_bridge.h ${{ env.BUNDLE }}/
          tar cJf ${{ env.BUNDLE }}.tar.xz ${{ env.BUNDLE }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}.tar.xz
          path: src/${{ env.BUNDLE }}.tar.xz